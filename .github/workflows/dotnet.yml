name: Build and Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      TEST_DB_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore MoneyKeeper.slnx

      - name: Build
        run: dotnet build MoneyKeeper.slnx --no-restore

      - name: Run tests
        run: dotnet test MoneyKeeper.slnx --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"