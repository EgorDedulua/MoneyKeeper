name: Build, test and push docker image

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TEST_DB_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore MoneyKeeper.slnx

      - name: Build
        run: dotnet build MoneyKeeper.slnx --no-restore --configuration Release

      - name: Run tests
        run: dotnet test MoneyKeeper.slnx --no-build --verbosity normal --configuration Release

  build-and-push-docker-image:
    runs-on: ubuntu-latest
    needs: test
    env:
      IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/moneykeeper-api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
         username: ${{ secrets.DOCKER_USERNAME }}
         password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max