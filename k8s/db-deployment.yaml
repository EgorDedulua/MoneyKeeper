apiVersion: apps/v1
kind: Deployment
metadata:
  name: moneykeeper-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: moneykeeper-db
  template:
    metadata:
      labels:
        app: moneykeeper-db
    spec:
      containers:
      - name: mssql-db
        image: mcr.microsoft.com/azure-sql-edge:latest
        ports:
        - containerPort: 1433
        env:
        - name: ACCEPT_EULA
          value: "Y"
        - name: MSSQL_SA_PASSWORD
          valueFrom:
            secretKeyRef:
              name: moneykeeper-secrets
              key: SA_PASSWORD
        volumeMounts:
        - name: mssql-data
          mountPath: /var/opt/mssql
      volumes:
      - name: mssql-data
        persistentVolumeClaim:
          claimName: mssql-pvc