services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: database
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
    ports:
      - "1433:1433"  
    volumes:
      - sql-data:/var/opt/mssql/data
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$SA_PASSWORD" -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
  api:
    depends_on:
      db:
        condition: service_healthy
    build:
      context: .               
      dockerfile: MoneyKeeper/Dockerfile
    container_name: api
    ports:
      - "3000:8080"            
      - "3001:8081"             
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ConnectionStrings__DefaultConnection=Server=db;Database=MoneyManagement;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=true
      - JwtOptions__SecretKey=${JwtOptions__SecretKey}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  sql-data: